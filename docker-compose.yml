services:
  candidatures:
    build: .
    image: candidatures:latest
    container_name: candidatures
    restart: unless-stopped
    ports:
      - "8085:8080"            # http://<ip-du-pi>:8085 (change le port de gauche si déjà pris)
    env_file:
      - path: .env             # AUTH_USER / AUTH_PASSWORD (facultatif)
        required: false
    volumes:
      - ./data:/data           # base SQLite + fichiers joints : c'est ce dossier qu'il faut sauvegarder
    environment:
      TZ: Europe/Paris

    # Pour passer par Nginx Proxy Manager avec le nom du conteneur, rejoindre son réseau :
    # networks:
    #   - npm

# networks:
#   npm:
#     external: true
#     name: nginx-proxy-manager_default
